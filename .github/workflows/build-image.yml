---
name: Build Docker image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - master
    paths-ignore:
      - ".github/**"
      - "README.md"

permissions:
  contents: read

jobs:
  build1:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          tags: app:ci
          push: false
          load: true
        env:
          SOURCE_DATE_EPOCH: 0

      - name: Report image digest
        run: |
          echo "Digest from the first image build: ${{ steps.build.outputs.digest }}"

  build2:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          tags: app:ci
          push: false
          load: true
        env:
          SOURCE_DATE_EPOCH: 0

      - name: Report image digest
        run: |
          echo "Digest from the second image build: ${{ steps.build.outputs.digest }}"

  reproducability:
    runs-on: ubuntu-latest
    needs:
      - build1
      - build2
    steps:

      - name: Report image digests
        run: |
          echo "Digest from the first image build: ${{ needs.build1.outputs.digest }}"
          echo "Digest from the second image build: ${{ needs.build2.outputs.digest }}"

      - name: Check if match
        if: needs.build1.outputs.digest != needs.build2.outputs.digest
        run: | 
          echo ${{ needs.build1.outputs.digest }} != ${{ needs.build1.outputs.digest }}
          exit 1
